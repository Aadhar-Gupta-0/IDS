name: Presentation static quality
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check app.js && node --check data.js
      - name: Reduced motion safeguard
        run: grep -q 'if (!reduceMotion) requestAnimationFrame(drawStars);' app.js
